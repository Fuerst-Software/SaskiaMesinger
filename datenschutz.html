<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Datenschutzerklärung</title>
  <meta name="description" content="Datenschutzerklärung gemäß DSGVO." />
  <meta name="robots" content="index,follow" />

  <style>
    :root{
      --navy:#020308;
      --navy-soft:#040711;
      --gold:#d4a436;
      --gold-soft:#f1c75c;
      --gold-strong:#ffd979;
      --text-strong:#f7f2eb;
      --text-soft:#cfc6bb;
      --text-muted:#8b847c;
      --radius:22px;
      --shadow:0 22px 60px rgba(0,0,0,.82);
      --focus:0 0 0 2px rgba(255,211,106,.35);
      --border:rgba(255,255,255,.14);
      --panel:linear-gradient(140deg, rgba(0,0,0,.60), rgba(0,0,0,.92));
      --surface:rgba(3,5,10,.55);
    }

    *{ box-sizing:border-box; }

    html,body{
      margin:0;
      padding:0;
      min-height:100%;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      background: radial-gradient(circle at top, #070a12 0%, #02030a 55%, #010107 100%);
      color:var(--text-strong);
      font-family:system-ui,-apple-system,"Segoe UI",Inter,Arial,sans-serif;
      -webkit-font-smoothing:antialiased;
      overflow-x:hidden;
      line-height:1.6;
    }

    a{
      color:var(--gold-strong);
      text-decoration:none;
    }

    a:hover{
      color:var(--gold-soft);
      text-shadow:0 0 10px rgba(255,211,106,.18);
    }

    a:focus-visible{
      outline:none;
      box-shadow:var(--focus);
      border-radius:10px;
    }

    .page{
      max-width:1100px;
      margin:0 auto;
      padding:26px 18px 64px;
    }

    .hero{
      padding:18px 0 18px;
      text-align:center;
    }

    .title-xl{
      margin:0;
      font-family:"Cormorant Garamond","Times New Roman",serif;
      font-weight:600;
      letter-spacing:.18em;
      text-transform:uppercase;
      font-size:clamp(2.2rem, 6vw, 3.9rem);
      background:linear-gradient(180deg,#fff4cc 0%,#ffd36a 28%,#f0b93a 55%,#c98e14 78%,#ffe7a8 100%);
      -webkit-background-clip:text;
      background-clip:text;
      -webkit-text-fill-color:transparent;
      text-shadow:0 0 10px rgba(255,211,106,.10);
    }

    .actions{
      display:flex;
      justify-content:center;
      gap:10px;
      flex-wrap:wrap;
      margin-top:14px;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:10px 18px;
      border-radius:999px;
      border:1px solid rgba(255,211,106,.55);
      background:rgba(8,10,14,.55);
      color:var(--text-strong);
      letter-spacing:.12em;
      text-transform:uppercase;
      font-size:.78rem;
      box-shadow:0 16px 34px rgba(0,0,0,.65);
      transition:transform .15s ease, border-color .15s ease, filter .15s ease;
    }

    .btn:hover{
      transform:translateY(-1px);
      border-color:var(--gold-strong);
      filter:brightness(1.06);
    }

    .btn--ghost{
      background:rgba(2,3,8,.35);
      color:var(--gold-strong);
    }

    .stack{
      display:flex;
      flex-direction:column;
      gap:18px;
      margin-top:18px;
    }

    .card{
      border-radius:var(--radius);
      border:1px solid var(--border);
      background:var(--panel);
      box-shadow:var(--shadow);
      padding:18px;
    }

    h2{
      margin:0 0 12px;
      font-family:"Cormorant Garamond","Times New Roman",serif;
      color:var(--gold-strong);
      letter-spacing:.10em;
      text-transform:uppercase;
      font-weight:600;
      font-size:1.35rem;
      text-align:center;
    }

    p{
      margin:10px 0;
      color:var(--text-soft);
      line-height:1.75;
    }

    .muted{
      color:var(--text-muted);
    }

    .legal-wrap{
      width:100%;
      border-radius:18px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(3,5,10,.55);
    }

    .legal-wrap .itrk-legaltext{
      width:100%;
    }

    .legal-wrap iframe{
      width:100% !important;
      border:0 !important;
      display:block;
      min-height:70vh;
      background:#fff;
    }

    footer{
      margin-top:28px;
      padding-top:16px;
      border-top:1px solid rgba(255,255,255,.14);
      text-align:center;
      color:var(--text-muted);
      font-size:.85rem;
    }

    .foot-links{
      margin-top:10px;
      display:flex;
      gap:10px;
      justify-content:center;
      flex-wrap:wrap;
    }

    @media (max-width: 768px){
      .page{
        padding:18px 12px 44px;
      }

      .card{
        padding:14px;
        border-radius:18px;
      }

      .title-xl{
        letter-spacing:.12em;
      }

      h2{
        font-size:1.15rem;
      }

      .legal-wrap iframe{
        min-height:78vh;
      }
    }

    @media (max-width: 480px){
      .btn{
        width:100%;
        max-width:320px;
      }

      .actions,
      .foot-links{
        flex-direction:column;
        align-items:center;
      }

      .legal-wrap iframe{
        min-height:82vh;
      }
    }
  </style>
</head>

<body>
  <main class="page" id="top">

    <section class="hero" aria-label="Seitenkopf">
      <h1 class="title-xl">Datenschutz</h1>
      <div class="actions">
        <a class="btn btn--ghost" href="index.html#top">← Zur Startseite</a>
      </div>
    </section>

    <section class="stack" aria-label="Datenschutzerklärung Inhalte">
      <article class="card">
        <h2>Datenschutzerklärung</h2>
        <p class="muted" style="text-align:center; margin-top:0;">
          Virtuelle Assistenz Saskia Mesinger
        </p>

        <div class="legal-wrap">
          <div class="itrk-legaltext" data-itrk-legaltext-url="https://itrk.legal/1x9o.8U.16fU-iframe.html"></div>
        </div>
      </article>
    </section>

    <footer>
      <div>© <span id="y"></span> Virtuelle Assistenz Saskia Mesinger</div>
      <div class="muted">Website erstellt durch <strong>Fürst Software &amp; Web Development</strong></div>
      <div class="foot-links">
        <a class="btn btn--ghost" href="impressum.html">Impressum</a>
        <a class="btn btn--ghost" href="Agb.html">AGB</a>
        <a class="btn btn--ghost" href="Widerruf.html">Widerruf</a>
      </div>
    </footer>

  </main>

  <script src="https://www.it-recht-kanzlei.de/js/itrk-legaltext.js"></script>
  <script>
    document.getElementById('y').textContent = new Date().getFullYear();
  </script>
</body>
</html>
